<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI 도서 추천 서비스{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --navy:#293a57; --page:#f3f5f8; --line:#e1e6ed; --muted:#758196; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:#263247; font-family:Arial,"Noto Sans KR",sans-serif; font-size:14px; }
    .topbar { min-height:48px; background:var(--navy); color:#fff; }
    .topbar-inner { width:min(100% - 32px, 1080px); min-height:48px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { color:#fff; text-decoration:none; font-size:17px; font-weight:700; letter-spacing:-.3px; white-space:nowrap; }
    .brand:hover,.nav-links a:hover { color:#dbeafe; }
    .nav-links { display:flex; align-items:center; flex-wrap:wrap; gap:17px; }
    .nav-links a { color:#e9eef7; text-decoration:none; font-size:12px; white-space:nowrap; }
    .subnav { min-height:29px; background:#344763; }
    .subnav-inner { width:min(100% - 32px,1080px); min-height:29px; margin:0 auto; display:flex; align-items:center; gap:16px; overflow-x:auto; }
    .subnav a { color:#d8e0ec; text-decoration:none; font-size:11px; white-space:nowrap; }
    .subnav a:hover { color:#fff; text-decoration:underline; }
    main { width:min(100% - 32px, 680px); margin:28px auto 56px; }
    .page-heading { margin:0 0 15px; font-size:17px; font-weight:700; color:#263247; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
    .panel { min-width:0; background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px; box-shadow:0 1px 2px rgba(20,35,55,.025); }
    .panel h2,.panel h3 { margin:0 0 10px; font-size:13px; font-weight:700; color:#303d52; }
    .panel p { margin:0 0 9px; line-height:1.65; }
    .muted { color:var(--muted); }
    .field-label { display:block; margin:0 0 5px; font-size:12px; font-weight:600; }
    input[type=text], input[type=file], textarea, select { display:block; width:100%; border:1px solid #dce2ea; border-radius:4px; padding:8px 9px; background:#fff; color:#263247; font-size:12px; }
    textarea { min-height:92px; resize:vertical; line-height:1.55; }
    input[type=file] { padding:7px; }
    .field-error,.errorlist { margin:5px 0 0; color:#c2413b; font-size:11px; list-style:none; padding:0; }
    .btn-primary { background:#304563; border-color:#304563; border-radius:4px; font-size:12px; padding:7px 12px; }
    .btn-primary:hover { background:#223550; border-color:#223550; }
    .btn-outline-primary { border-radius:4px; font-size:12px; padding:7px 12px; color:#304563; border-color:#8293aa; }
    .btn-outline-primary:hover { background:#304563; border-color:#304563; }
    .result-text { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.7; font-size:12px; }
    .result-box { background:#f7f9fc; border:1px solid #e8edf3; border-radius:4px; padding:10px; font-size:12px; line-height:1.6; }
    .notice { margin-top:10px; padding:9px 10px; border-radius:4px; background:#fff7e8; color:#8b6325; font-size:11px; line-height:1.55; }
    .success { background:#eef8f1; color:#28633d; }
    .danger { background:#fff0ef; color:#a53a34; }
    .cover-image { display:block; width:100%; max-height:430px; object-fit:contain; background:#f2f4f7; border-radius:4px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .small-note { margin-top:10px; color:var(--muted); font-size:11px; line-height:1.5; }
    @media (max-width:650px) {
      .topbar-inner { align-items:flex-start; flex-direction:column; padding:10px 0; gap:8px; }
      .nav-links { gap:12px; }
      main { margin-top:18px; }
      .two-col { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'recommend:input' %}">AI 도서 추천 서비스</a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="{% url 'recommend:input' %}">도서 추천</a>
        <a href="{% url 'recommend:upload' %}">표지 분석</a>
      </nav>
    </div>
  </div>
  <div class="subnav">
    <nav class="subnav-inner" aria-label="기능 메뉴">
      <a href="{% url 'recommend:input' %}?mode=validation#recommend-form">입력 검증</a>
      <a href="{% url 'recommend:input' %}?mode=text#recommend-form">텍스트 추천</a>
      <a href="{% url 'recommend:input' %}?mode=route#recommend-form">라우트 결정</a>
      <a href="{% url 'recommend:input' %}?mode=image#recommend-form">이미지 생성</a>
      <a href="{% url 'recommend:upload' %}">이미지 분석</a>
      <a href="{% url 'recommend:input' %}?mode=control#response-guide">API 흐름 제어</a>
      <a href="{% url 'recommend:tts' %}">TTS</a>
    </nav>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
